# Decorations
hide_window_decorations yes
inactive_text_alpha     0.8
background_opacity      0.8

# Font
font_family CaskaydiaCove Nerd Font Mono
font_size   11.0

# Cursor
cursor_shape beam
cursor_trail 1

# Padding (why weird value? consistency with foot)
window_margin_width 21.75

# No stupid close confirmation
confirm_os_window_close 0

# Copy, Paste
map ctrl+c copy_or_interrupt
map ctrl+v paste
#detect_urls no
copy_on_select clipboard
strip_trailing_spaces smart
select_by_word_characters ${}/&@_.
focus_follows_mouse yes
mouse_map right press grabbed,ungrabbed no-op
mouse_map right click grabbed,ungrabbed paste_from_clipboard
#allow_hyperlinks no

# Find (needs fzf)
map ctrl+f launch --type=overlay --stdin-source=@screen_scrollback /bin/sh -c 'fzf --no-sort --no-mouse --exact -i --tac | tr -d "\n" | kitty +kitten clipboard'

# Zoom
map ctrl+page_up     change_font_size all +1
map ctrl+page_down   change_font_size all -1
map ctrl+plus        change_font_size all +1
map ctrl+equal       change_font_size all +1
map ctrl+kp_add      change_font_size all +1
map ctrl+minus       change_font_size all -1
map ctrl+underscore  change_font_size all -1
map ctrl+kp_subtract change_font_size all -1
map ctrl+0           change_font_size all 0
map ctrl+kp_0        change_font_size all 0

# Cursor
map ctrl+backspace send_text all \x17
